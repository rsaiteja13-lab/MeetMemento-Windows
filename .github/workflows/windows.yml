name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and safety checks
        run: npm run verify

      - name: Build Windows installers and portable packages
        run: npm run dist:win

      - name: Launch packaged app in smoke-test mode
        shell: powershell
        run: |
          $process = Start-Process -FilePath ".\dist\win-unpacked\MeetMemento.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed with exit code $($process.ExitCode)." }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MeetMemento-Windows-0.10.1
          path: |
            dist/MeetMemento-Windows-0.10.1-*.exe
            dist/MeetMemento-Windows-0.10.1-*.zip
          if-no-files-found: error

  publish-release-assets:
    if: github.event_name == 'release'
    needs: verify-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@v4
        with:
          name: MeetMemento-Windows-0.10.1
          path: release-assets

      - name: Attach Windows packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
