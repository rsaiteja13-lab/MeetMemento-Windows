name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and safety checks
        run: npm run verify

      - name: Build Windows installers and portable packages
        run: npm run dist:win

      - name: Launch packaged app in smoke-test mode
        shell: powershell
        run: |
          $process = Start-Process -FilePath ".\dist\win-unpacked\MeetMemento.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed with exit code $($process.ExitCode)." }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MeetMemento-Windows-0.10.1
          path: |
            dist/MeetMemento-Windows-0.10.1-*.exe
            dist/MeetMemento-Windows-0.10.1-*.zip
          if-no-files-found: error

  publish-release-assets:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: verify-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@v4
        with:
          name: MeetMemento-Windows-0.10.1
          path: release-assets

      - name: Select release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.10.1" >> "$GITHUB_ENV"
          fi

      - name: Create verified Windows release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" \
            --target main \
            --title "MeetMemento for Windows 0.10.1" \
            --notes "Verified x64 and ARM64 installers and portable packages. Includes reliable full-length video, clean system-audio playback, separate echo-reduced microphone capture, broader meeting detection, recovery safeguards, and multi-select deletion. Recordings and personal data are never included. These development packages are not Authenticode-signed, so Windows SmartScreen may show a warning."

      - name: Attach Windows packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
